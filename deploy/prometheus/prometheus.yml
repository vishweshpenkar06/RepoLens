global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: repoprism-compose
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]
  - job_name: repoprism-host
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
