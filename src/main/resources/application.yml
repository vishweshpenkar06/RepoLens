spring:
  application:
    name: repolens
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/repolens}
    username: ${DB_USERNAME:repolens}
    password: ${DB_PASSWORD:repolens}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        name: repolens
        version: 0.1.0
        type: sync
        protocol: ${MCP_PROTOCOL:streamable}
        stdio: ${MCP_STDIO:false}
    model:
      embedding: ${EMBEDDING_PROVIDER:transformers}
    embedding:
      transformer:
        onnx:
          model-uri: ${EMBEDDING_MODEL_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx}
          model-output-name: last_hidden_state
        tokenizer:
          uri: ${EMBEDDING_TOKENIZER_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/raw/main/tokenizer.json}
          options:
            padding: true
        cache:
          directory: ${EMBEDDING_CACHE_DIR:${java.io.tmpdir}/repolens-onnx}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readiness:
      include: db,embedder
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        "[repolens.ask.latency]": true
        "[repolens.retrieval.latency]": true
        "[repolens.llm.latency]": true
        "[repolens.ingest.duration]": true
      percentiles:
        "[repolens.ask.latency]": 0.5,0.95,0.99
        "[repolens.retrieval.latency]": 0.5,0.95,0.99

logging:
  structured:
    format:
      console: ecs

repolens:
  github:
    token: ${GITHUB_TOKEN:}
    base-url: https://api.github.com
    issues-enabled: ${GITHUB_ISSUES_ENABLED:true}
    issue-limit: 300
    max-file-bytes: 1048576
  embedding:
    concurrency: 2
    batch-size: 32
    dimensions: 384
    warmup: true
  retrieval:
    candidates: 30
    top-k: 6
    rrf-k: 60
  ask:
    timeout: 20s
    max-question-length: 1000
    top-k-max: 12
  llm:
    provider: ${LLM_PROVIDER:fake}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    timeout: 60s
    max-tokens: ${LLM_MAX_TOKENS:2048}
    temperature: 0.0
    json-mode: ${LLM_JSON_MODE:true}
    fake-latency: ${LLM_FAKE_LATENCY:0ms}
  cache:
    answer-ttl: 1h
    answer-max-size: 10000
    embedding-ttl: 24h
    embedding-max-size: 10000
  security:
    api-key-required: ${REPOLENS_API_KEY_REQUIRED:true}
    bootstrap-api-key: ${REPOLENS_API_KEY:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    ask-capacity: ${RATE_LIMIT_ASK_CAPACITY:10}
    ask-refill-per-second: ${RATE_LIMIT_ASK_REFILL:0.5}
    search-capacity: ${RATE_LIMIT_SEARCH_CAPACITY:30}
    search-refill-per-second: ${RATE_LIMIT_SEARCH_REFILL:5}
    general-capacity: ${RATE_LIMIT_GENERAL_CAPACITY:60}
    general-refill-per-second: ${RATE_LIMIT_GENERAL_REFILL:10}
