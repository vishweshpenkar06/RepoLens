spring:
  application:
    name: repolens
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/repolens}
    username: ${DB_USERNAME:repolens}
    password: ${DB_PASSWORD:repolens}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      embedding: ${EMBEDDING_PROVIDER:transformers}
    embedding:
      transformer:
        onnx:
          model-uri: ${EMBEDDING_MODEL_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx}
          model-output-name: last_hidden_state
        tokenizer:
          uri: ${EMBEDDING_TOKENIZER_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/raw/main/tokenizer.json}
          options:
            padding: true
        cache:
          directory: ${EMBEDDING_CACHE_DIR:${java.io.tmpdir}/repolens-onnx}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readiness:
      include: db,embedder
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ecs

repolens:
  github:
    token: ${GITHUB_TOKEN:}
    base-url: https://api.github.com
    issues-enabled: ${GITHUB_ISSUES_ENABLED:true}
    issue-limit: 300
    max-file-bytes: 1048576
  embedding:
    concurrency: 2
    batch-size: 32
    dimensions: 384
    warmup: true
  retrieval:
    candidates: 30
    top-k: 6
    rrf-k: 60
  ask:
    timeout: 20s
    max-question-length: 1000
    top-k-max: 12
