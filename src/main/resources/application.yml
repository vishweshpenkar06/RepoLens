spring:
  application:
    name: repolens
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/repolens}
    username: ${DB_USERNAME:repolens}
    password: ${DB_PASSWORD:repolens}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readiness:
      include: db
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ecs

repolens:
  github:
    token: ${GITHUB_TOKEN:}
    base-url: https://api.github.com
  embedding:
    concurrency: 2
    batch-size: 32
  retrieval:
    candidates: 30
    top-k: 6
    rrf-k: 60
  ask:
    timeout: 20s
    max-question-length: 1000
    top-k-max: 12
