name: repolens

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: ${DB_NAME:-repolens}
      POSTGRES_USER: ${DB_USERNAME:-repolens}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-repolens}
    ports:
      # Host port 5432 is taken on this machine; see docs/ENVIRONMENT.md.
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-repolens} -d ${DB_NAME:-repolens}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: repolens:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-repolens}
      DB_USERNAME: ${DB_USERNAME:-repolens}
      DB_PASSWORD: ${DB_PASSWORD:-repolens}
      REPOLENS_API_KEY: ${REPOLENS_API_KEY:-demo-key-change-me}
      REPOLENS_API_KEY_REQUIRED: ${REPOLENS_API_KEY_REQUIRED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_CACHE_DIR: /app/.cache/repolens-onnx
      SERVER_PORT: 8081
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8081"
    volumes:
      - onnxdata:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:exec,size=512m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local-dev-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # Host port 3000 is taken on this machine.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  grafanadata:
  onnxdata:
